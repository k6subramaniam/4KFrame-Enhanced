services:
  frame:
    build: .
    image: 4kframe-enhanced
    container_name: 4kframe
    restart: unless-stopped
    ports:
      - "9095:9095" # HTTP (admin + display + API)
      - "9096:9096" # HTTPS (self-signed)
    volumes:
      - frame-data:/data
    environment:
      # Optional — enables Google Photos import via the Photo Picker API.
      # GOOGLE_CLIENT_ID: ""
      # GOOGLE_CLIENT_SECRET: ""
      # GOOGLE_REDIRECT_URI: "http://<frame-host>:9095/api/google/callback"
      # HTTPS on :9096 is self-signed by default. To use your own cert, mount it and set:
      # FRAME_TLS_CERT: /data/cert.pem
      # FRAME_TLS_KEY: /data/key.pem
      # FRAME_DISABLE_HTTPS: "1"   # to turn HTTPS off entirely
      FRAME_DATA_DIR: /data

volumes:
  frame-data:
