services:
  frame:
    build: .
    image: 4kframe-enhanced
    container_name: 4kframe
    restart: unless-stopped
    ports:
      - "9095:9095" # HTTP (admin + display + API)
      - "9096:9096" # HTTPS (self-signed)
    volumes:
      - frame-data:/data
    environment:
      # Optional — enables Google Photos import & auto-sync.
      # GOOGLE_CLIENT_ID: ""
      # GOOGLE_CLIENT_SECRET: ""
      # GOOGLE_REDIRECT_URI: "http://<frame-host>:9095/api/google/callback"
      FRAME_DATA_DIR: /data

volumes:
  frame-data:
