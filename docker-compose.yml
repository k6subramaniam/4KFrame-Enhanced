services:
  frame:
    build: .
    image: 4kframe-enhanced
    container_name: 4kframe
    restart: unless-stopped
    ports:
      - "9095:9095" # HTTP (admin + display + API)
      - "9096:9096" # HTTPS (self-signed)
    volumes:
      - frame-data:/data
    # Config/secrets come from a gitignored `.env` in this directory (see .env.example).
    # Docker Compose auto-loads it; empty values fall back to the server's defaults.
    environment:
      # Google Photos (Photo Picker API). Leave empty to disable.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      # HTTPS on :9096 is self-signed by default. Override with your own cert, or disable.
      FRAME_TLS_CERT: ${FRAME_TLS_CERT:-}
      FRAME_TLS_KEY: ${FRAME_TLS_KEY:-}
      FRAME_DISABLE_HTTPS: ${FRAME_DISABLE_HTTPS:-}
      FRAME_DATA_DIR: /data

volumes:
  frame-data:
