<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>4KFrame</title>
    <style>
      :root {
        color-scheme: dark;
        --display-bg: #000;
        --display-text: #f8fafc;
        --display-muted: #cbd5e1;
        --display-dim: #94a3b8;
        --display-panel: rgba(7, 10, 18, 0.82);
        --display-panel-strong: rgba(15, 23, 42, 0.94);
        --display-card: rgba(30, 41, 59, 0.72);
        --display-border: rgba(226, 232, 240, 0.18);
        --display-ring: rgba(125, 211, 252, 0.9);
        --display-primary: #38bdf8;
        --display-primary-strong: #0ea5e9;
        --display-shadow: 0 24px 80px rgba(0, 0, 0, 0.58);
        --display-radius: 22px;
        --display-touch: 44px;
      }

      html, body { margin: 0; height: 100%; background: var(--display-bg); overflow: hidden; cursor: none; }
      #app { position: fixed; inset: 0; overflow: hidden; }
      #gl { position: absolute; inset: 0; width: 100%; height: 100%; }
      /* Backdrop behind videos: opaque black base + optional blurred poster (blur mode). */
      #video-bg { position: absolute; inset: 0; background-color: #000;
        background-size: cover; background-position: center; filter: blur(28px); transform: scale(1.1);
        opacity: 0; transition: opacity 0.6s ease; }
      #video-bg.visible { opacity: 1; }
      video { position: absolute; inset: 0; object-fit: contain; opacity: 0; transition: opacity 0.6s ease; }
      video.visible { opacity: 1; }
      .overlay { position: absolute; color: #fff; font-family: system-ui, sans-serif;
        text-shadow: 0 2px 8px rgba(0,0,0,0.7); pointer-events: none; }
      #clock { top: 4vh; left: 4vw; font-size: 4vh; font-weight: 300; }
      #caption { bottom: 4vh; left: 4vw; font-size: 3vh; max-width: 60vw; }
      #qr { bottom: 3vh; right: 3vw; width: 12vh; height: 12vh; background: #fff; padding: 1vh; border-radius: 1vh; }
      #qr img { width: 100%; height: 100%; display: block; }
      #status { bottom: 3vh; left: 4vw; font-size: 2.4vh; opacity: 0.6; }
      #public-controls { position: absolute; inset: 0; z-index: 20; pointer-events: none;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #fff; }
      #public-controls, #public-controls * { box-sizing: border-box; }
      #public-controls button, #public-controls input, #public-controls select { font: inherit; }
      #public-controls #public-controls-toggle, #public-controls #public-bottom-controller {
        transition: opacity 260ms ease, transform 260ms ease, filter 260ms ease; }
      #public-controls.is-dimmed #public-controls-toggle, #public-controls.is-dimmed #public-bottom-controller {
        opacity: 0.36; filter: saturate(0.82); }
      #public-controls.is-hidden #public-controls-toggle, #public-controls.is-hidden #public-bottom-controller {
        opacity: 0.04; pointer-events: none; filter: saturate(0.65); }
      #public-controls:focus-within #public-controls-toggle, #public-controls:focus-within #public-bottom-controller,
      #public-controls:has(#public-controls-toggle[aria-expanded="true"]) #public-controls-toggle,
      #public-controls:has(#public-controls-toggle[aria-expanded="true"]) #public-bottom-controller {
        opacity: 0.94; pointer-events: auto; filter: none; }
      #public-controls-toggle { position: absolute; top: max(1rem, env(safe-area-inset-top));
        right: max(1rem, env(safe-area-inset-right)); pointer-events: auto; cursor: auto; border: 1px solid rgba(255,255,255,0.16);
        border-radius: 999px; padding: 0.48rem 0.72rem; color: rgba(255,255,255,0.82); background: rgba(10,10,14,0.18);
        box-shadow: 0 8px 24px rgba(0,0,0,0.22); backdrop-filter: blur(14px); opacity: 0.22; font-size: 0.86rem;
        transition: opacity 180ms ease, background 180ms ease, border-color 180ms ease, transform 180ms ease; }
      #public-controls-toggle:hover, #public-controls-toggle:focus-visible, #public-controls-toggle[aria-expanded="true"] {
        opacity: 0.88; color: #fff; border-color: rgba(255,255,255,0.3); background: rgba(20,20,26,0.72); transform: translateY(-1px); }
      #public-control-panel { position: absolute; right: max(1rem, env(safe-area-inset-right));
        top: calc(max(1rem, env(safe-area-inset-top)) + 3.35rem); width: min(22rem, calc(100vw - 2rem));
        max-height: min(70vh, calc(100vh - 7rem)); overflow: auto; pointer-events: auto; cursor: auto;
        border: 1px solid rgba(255,255,255,0.12); border-radius: 1.1rem;
        background: linear-gradient(180deg, rgba(18,18,24,0.78), rgba(5,5,8,0.68));
        box-shadow: 0 20px 56px rgba(0,0,0,0.46); backdrop-filter: blur(18px);
        padding: 0.75rem; opacity: 0.9; transform: none; transition: opacity 180ms ease, transform 180ms ease; }
      #public-control-panel[hidden] { display: none; }
      .public-control-header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin: 0 0 0.75rem; }
      .public-control-title { font-size: 0.95rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
      .public-control-note { font-size: 0.72rem; color: rgba(255,255,255,0.6); }
      #public-playback { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.5rem; margin-bottom: 0.8rem; }
      #public-bottom-controller { position: absolute; left: 50%; bottom: max(1rem, env(safe-area-inset-bottom));
        display: grid; grid-template-columns: repeat(3, minmax(3.25rem, auto)); align-items: center; gap: clamp(0.45rem, 2vw, 0.8rem);
        transform: translateX(-50%); padding: clamp(0.38rem, 1.4vw, 0.55rem); pointer-events: auto; cursor: auto;
        border: 1px solid rgba(255,255,255,0.16); border-radius: 999px;
        background: linear-gradient(180deg, rgba(18,18,24,0.72), rgba(5,5,8,0.62));
        box-shadow: 0 18px 52px rgba(0,0,0,0.45); backdrop-filter: blur(18px); opacity: 0.94; }
      #public-bottom-controller:focus-within, #public-bottom-controller:hover { opacity: 1; }
      .public-icon-button, #public-settings button { min-height: 2.35rem; border: 1px solid rgba(255,255,255,0.16);
        border-radius: 0.8rem; color: #fff; background: rgba(255,255,255,0.08); cursor: auto; }
      .public-icon-button { font-size: 1.1rem; }
      .public-bottom-button { min-width: clamp(3.1rem, 10vw, 4.25rem); min-height: clamp(2.8rem, 8vw, 3.5rem);
        border-radius: 999px; font-size: clamp(1.3rem, 4vw, 1.8rem); background: rgba(255,255,255,0.12); }
      .public-bottom-button[data-control="play-pause"] { min-width: clamp(3.7rem, 12vw, 5rem); font-size: clamp(1.45rem, 4.4vw, 2rem); }
      .public-icon-button:hover, .public-icon-button:focus-visible, #public-settings button:hover, #public-settings button:focus-visible {
        background: rgba(255,255,255,0.18); border-color: rgba(255,255,255,0.34); }
      .public-icon-button:disabled, #public-settings button:disabled {
        opacity: 0.45; cursor: not-allowed; }
      #public-settings { display: grid; grid-template-columns: 1fr; gap: 0.72rem; }
      #public-settings .panel { border: 1px solid rgba(255,255,255,0.12); border-radius: 0.9rem;
        background: rgba(255,255,255,0.055); overflow: hidden; }
      #public-settings .panel-heading { margin: 0; font-size: 0.88rem; }
      #public-settings .panel-toggle { width: 100%; display: flex; align-items: center; justify-content: space-between;
        gap: 0.8rem; border: 0; border-radius: 0; background: transparent; padding: 0.72rem 0.8rem;
        color: rgba(255,255,255,0.86); text-align: left; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
      #public-settings .panel-toggle:hover, #public-settings .panel-toggle:focus-visible { background: rgba(255,255,255,0.08); }
      #public-settings .panel-chevron { transition: transform 0.18s ease; }
      #public-settings .panel[data-collapsed="true"] .panel-chevron { transform: rotate(-90deg); }
      #public-settings .panel-body { display: grid; grid-template-rows: 1fr; opacity: 1; transition: grid-template-rows 0.2s ease, opacity 0.18s ease; }
      #public-settings .panel[data-collapsed="true"] .panel-body { grid-template-rows: 0fr; opacity: 0; }
      #public-settings .panel-body-inner { min-height: 0; overflow: hidden; padding: 0 0.8rem 0.8rem; }
      #public-settings .panel[data-collapsed="true"] .panel-body-inner { padding-bottom: 0; }
      #public-settings .panel-subheading { margin: 0.85rem 0 0.55rem; font-size: 0.82rem; color: rgba(255,255,255,0.76); }
      #public-settings .row, #public-settings .seg { display: flex; flex-wrap: wrap; gap: 0.35rem; align-items: center; }
      #public-settings .seg button { flex: 1 1 auto; padding: 0 0.62rem; font-size: 0.82rem; }
      #public-settings button.active { background: rgba(255,255,255,0.24); border-color: rgba(255,255,255,0.5); }
      #public-settings .field { display: grid; gap: 0.4rem; color: rgba(255,255,255,0.74); font-size: 0.82rem; }
      #public-settings input[type="range"] { width: 100%; accent-color: #fff; cursor: auto; }
      #public-settings .muted { color: rgba(255,255,255,0.62); font-size: 0.78rem; line-height: 1.35; }
      @media (min-width: 860px) {
        #public-control-panel { width: min(30rem, calc(100vw - 2rem)); }
        #public-settings { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }
      @media (max-width: 700px) {
        #public-controls-toggle { top: auto; bottom: calc(max(1rem, env(safe-area-inset-bottom)) + 4.75rem); right: 50%; transform: translateX(50%); }
        #public-controls-toggle:hover, #public-controls-toggle:focus-visible { transform: translateX(50%) translateY(-1px); }
        #public-bottom-controller { bottom: max(0.75rem, env(safe-area-inset-bottom)); width: min(calc(100vw - 1.5rem), 22rem);
          grid-template-columns: repeat(3, minmax(0, 1fr)); justify-items: center; }
        #public-control-panel { position: absolute; inset: auto 0 0 0; width: auto; max-height: 58vh; border-radius: 1.25rem 1.25rem 0 0;
          padding: 1rem max(1rem, env(safe-area-inset-right)) calc(max(1rem, env(safe-area-inset-bottom)) + 5rem) max(1rem, env(safe-area-inset-left));
          transform: translateY(1rem); }
      }
      .hidden { display: none !important; }

      @media (max-width: 720px), (pointer: coarse) and (max-width: 900px) {
        .public-controls {
          top: auto;
          left: 0;
          right: 0;
          bottom: 0;
          width: auto;
          max-height: min(78dvh, 620px);
          padding: 18px max(16px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
          border-radius: 26px 26px 0 0;
          border-right: 0;
          border-bottom: 0;
          border-left: 0;
        }
        .controls-playback { grid-template-columns: repeat(3, minmax(72px, 1fr)); }
      }

      @media (min-width: 1200px) {
        .controls-toggle { padding-inline: 24px; }
        .public-controls { width: 420px; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="gl"></canvas>
      <div id="video-bg"></div>
      <video id="video" muted playsinline></video>
      <div id="clock" class="overlay hidden"></div>
      <div id="caption" class="overlay hidden"></div>
      <div id="qr" class="overlay hidden"><img alt="Scan to manage" /></div>
      <div id="status" class="overlay">Connecting…</div>
      <section id="public-controls" aria-label="Public slideshow controls">
        <div id="public-bottom-controller" aria-label="Playback controls" role="group">
          <button id="public-bottom-previous" class="public-icon-button public-bottom-button" type="button" data-control="previous" aria-label="Previous photo">‹</button>
          <button id="public-bottom-play-pause" class="public-icon-button public-bottom-button" type="button" data-control="play-pause" aria-label="Play or pause">⏯</button>
          <button id="public-bottom-next" class="public-icon-button public-bottom-button" type="button" data-control="next" aria-label="Next photo">›</button>
        </div>
        <button id="public-controls-toggle" type="button" aria-controls="public-control-panel" aria-expanded="false">Controls</button>
        <aside id="public-control-panel" aria-label="Slideshow controls" hidden>
          <div class="public-control-header">
            <div class="public-control-title">Frame Controls</div>
            <div class="public-control-note">Dims when idle</div>
          </div>
          <div id="public-playback" aria-label="Playback">
            <button id="public-previous" class="public-icon-button" type="button" data-control="previous" aria-label="Previous photo">‹</button>
            <button id="public-play-pause" class="public-icon-button" type="button" data-control="play-pause" aria-label="Play or pause">⏯</button>
            <button id="public-next" class="public-icon-button" type="button" data-control="next" aria-label="Next photo">›</button>
          </div>
          <div id="public-settings" aria-label="Slideshow settings"></div>
        </aside>
      </section>
    </div>
    <!-- Load the Cast receiver framework only on Chromecast/Android TV (CrKey) devices, so
         regular TV browsers never block on an external dependency. The receiver bridge in
         main.ts waits briefly for it to become available. -->
    <script>
      if (/\bCrKey\b/.test(navigator.userAgent)) {
        var s = document.createElement('script');
        s.src = 'https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js';
        document.head.appendChild(s);
      }
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
