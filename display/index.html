<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>4KFrame</title>
    <style>
      :root {
        color-scheme: dark;
        --display-bg: #000;
        --display-text: #f8fafc;
        --display-muted: #cbd5e1;
        --display-dim: #94a3b8;
        --display-panel: rgba(7, 10, 18, 0.82);
        --display-panel-strong: rgba(15, 23, 42, 0.94);
        --display-card: rgba(30, 41, 59, 0.72);
        --display-border: rgba(226, 232, 240, 0.18);
        --display-ring: rgba(125, 211, 252, 0.9);
        --display-primary: #38bdf8;
        --display-primary-strong: #0ea5e9;
        --display-shadow: 0 24px 80px rgba(0, 0, 0, 0.58);
        --display-radius: 22px;
        --display-touch: 44px;
      }

      html, body { margin: 0; height: 100%; background: var(--display-bg); overflow: hidden; cursor: none; }
      #app { position: fixed; inset: 0; overflow: hidden; }
      #gl { position: absolute; inset: 0; width: 100%; height: 100%; }
      /* Backdrop behind videos: opaque black base + optional blurred poster (blur mode). */
      #video-bg { position: absolute; inset: 0; background-color: #000;
        background-size: cover; background-position: center; filter: blur(28px); transform: scale(1.1);
        opacity: 0; transition: opacity 0.6s ease; }
      #video-bg.visible { opacity: 1; }
      video { position: absolute; inset: 0; object-fit: contain; opacity: 0; transition: opacity 0.6s ease; }
      video.visible { opacity: 1; }
      .overlay { position: absolute; color: #fff; font-family: system-ui, sans-serif;
        text-shadow: 0 2px 8px rgba(0,0,0,0.7); pointer-events: none; }
      #clock { top: 4vh; left: 4vw; font-size: 4vh; font-weight: 300; }
      #caption { bottom: 4vh; left: 4vw; font-size: 3vh; max-width: 60vw; }
      #qr { bottom: 3vh; right: 3vw; width: 12vh; height: 12vh; background: #fff; padding: 1vh; border-radius: 1vh; }
      #qr img { width: 100%; height: 100%; display: block; }
      #status { bottom: 3vh; left: 4vw; font-size: 2.4vh; opacity: 0.6; }
      .live-cast-layer { position: absolute; inset: 0; width: 100%; height: 100%;
        object-fit: contain; background: #000; z-index: 15; display: none; }
      .live-cast-layer.visible { display: block; }
      #public-controls { position: absolute; inset: 0; z-index: 20; pointer-events: none;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #fff; }
      #public-controls, #public-controls * { box-sizing: border-box; }
      #public-controls button, #public-controls input, #public-controls select { font: inherit; }
      #public-controls button:focus-visible, #public-controls input:focus-visible, #public-controls select:focus-visible {
        outline: 3px solid var(--display-ring); outline-offset: 3px; box-shadow: 0 0 0 6px rgba(14,165,233,0.22);
      }
      #public-bottom-controller { position: absolute; left: 50%; bottom: max(1.25rem, env(safe-area-inset-bottom));
        display: flex; align-items: center; justify-content: center; gap: 0.8rem; padding: 0.7rem;
        min-width: min(28rem, calc(100vw - 2rem)); pointer-events: auto; cursor: auto;
        border: 1px solid rgba(255,255,255,0.14); border-radius: 999px;
        background: linear-gradient(180deg, rgba(15,23,42,0.78), rgba(3,7,18,0.66));
        box-shadow: 0 18px 54px rgba(0,0,0,0.48); backdrop-filter: blur(18px);
        opacity: 0.96; transform: translate(-50%, 0) scale(1); transition: opacity 220ms ease, transform 220ms ease, filter 220ms ease;
      }
      #public-bottom-controller.is-dim { opacity: 0.34; filter: saturate(0.84); transform: translate(-50%, 0.35rem) scale(0.98); }
      #public-bottom-controller.is-hidden { opacity: 0; pointer-events: none; transform: translate(-50%, 1.1rem) scale(0.96); }
      #public-bottom-controller:focus-within { opacity: 1; filter: none; transform: translate(-50%, 0) scale(1); }
      .public-playback-button { display: inline-grid; place-items: center; min-width: 3.5rem; min-height: 3.5rem;
        border: 1px solid rgba(255,255,255,0.18); border-radius: 999px; color: #fff;
        background: rgba(255,255,255,0.1); cursor: auto; font-size: 1.35rem; line-height: 1;
        text-shadow: 0 1px 6px rgba(0,0,0,0.45); transition: background 160ms ease, border-color 160ms ease, transform 160ms ease, opacity 160ms ease;
      }
      .public-playback-button:hover, .public-playback-button:focus-visible { background: rgba(255,255,255,0.22); border-color: rgba(255,255,255,0.44); transform: translateY(-1px); }
      .public-playback-button:disabled { opacity: 0.46; cursor: not-allowed; }
      .public-playback-button.primary { min-width: 4.25rem; min-height: 4.25rem; font-size: 1.55rem; background: rgba(56,189,248,0.22); border-color: rgba(125,211,252,0.46); }
      #public-controls-toggle { position: absolute; top: max(1rem, env(safe-area-inset-top));
        right: max(1rem, env(safe-area-inset-right)); pointer-events: auto; cursor: auto; border: 1px solid rgba(255,255,255,0.16);
        border-radius: 999px; padding: 0.48rem 0.72rem; color: rgba(255,255,255,0.82); background: rgba(10,10,14,0.18);
        box-shadow: 0 8px 24px rgba(0,0,0,0.22); backdrop-filter: blur(14px); opacity: 0.22; font-size: 0.86rem;
        transition: opacity 180ms ease, background 180ms ease, border-color 180ms ease, transform 180ms ease; }
      #public-controls-toggle:hover, #public-controls-toggle:focus-visible, #public-controls-toggle[aria-expanded="true"] {
        opacity: 0.88; color: #fff; border-color: rgba(255,255,255,0.3); background: rgba(20,20,26,0.72); transform: translateY(-1px); }
      #public-control-panel { position: absolute; right: max(1rem, env(safe-area-inset-right));
        top: calc(max(1rem, env(safe-area-inset-top)) + 3.35rem); width: min(22rem, calc(100vw - 2rem));
        max-height: min(70vh, calc(100vh - 7rem)); overflow: auto; pointer-events: auto; cursor: auto;
        border: 1px solid rgba(255,255,255,0.12); border-radius: 1.1rem;
        background: linear-gradient(180deg, rgba(18,18,24,0.78), rgba(5,5,8,0.68));
        box-shadow: 0 20px 56px rgba(0,0,0,0.46); backdrop-filter: blur(18px);
        padding: 0.75rem; opacity: 0.9; transform: none; transition: opacity 180ms ease, transform 180ms ease; }
      #public-control-panel[hidden] { display: none; }
      .public-control-header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin: 0 0 0.75rem; }
      .public-control-title { font-size: 0.95rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
      .public-control-note { font-size: 0.72rem; color: rgba(255,255,255,0.6); }
      #public-playback { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.5rem; margin-bottom: 0.8rem; }
      #public-quick-actions { display: grid; grid-template-columns: 1fr; gap: 0.55rem; margin-bottom: 0.8rem; }
      .public-quick-row, .public-zoom-pan-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0.45rem; }
      .public-collapse { border: 1px solid rgba(255,255,255,0.12); border-radius: 0.9rem;
        background: rgba(255,255,255,0.055); overflow: hidden; }
      .public-collapse-heading { margin: 0; font-size: 0.88rem; }
      .public-collapse-toggle { width: 100%; min-height: 2.35rem; display: flex; align-items: center; justify-content: space-between;
        gap: 0.8rem; border: 0; border-radius: 0; background: transparent; padding: 0.72rem 0.8rem;
        color: rgba(255,255,255,0.86); cursor: auto; text-align: left; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
      .public-collapse-toggle:hover, .public-collapse-toggle:focus-visible { background: rgba(255,255,255,0.08); }
      .public-collapse-chevron { transition: transform 0.18s ease; }
      .public-collapse[data-collapsed="true"] .public-collapse-chevron { transform: rotate(-90deg); }
      .public-collapse-body { display: grid; grid-template-rows: 1fr; opacity: 1; transition: grid-template-rows 0.2s ease, opacity 0.18s ease; }
      .public-collapse[data-collapsed="true"] .public-collapse-body { grid-template-rows: 0fr; opacity: 0; }
      .public-collapse-body-inner { min-height: 0; overflow: hidden; padding: 0 0.8rem 0.8rem; }
      .public-collapse[data-collapsed="true"] .public-collapse-body-inner { padding-bottom: 0; }
      .public-icon-button, .public-quick-button, #public-settings button { min-height: 2.35rem; border: 1px solid rgba(255,255,255,0.16);
        border-radius: 0.8rem; color: #fff; background: rgba(255,255,255,0.08); cursor: auto; }
      .public-icon-button { font-size: 1.1rem; }
      .public-quick-button { padding: 0.42rem 0.5rem; font-size: 0.82rem; line-height: 1.1; }
      .public-quick-button.is-selected, .public-quick-button[aria-pressed="true"] {
        border-color: rgba(125,211,252,0.72); background: rgba(14,165,233,0.42); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12); }
      .public-icon-button:hover, .public-icon-button:focus-visible, .public-quick-button:hover, .public-quick-button:focus-visible,
      #public-settings button:hover, #public-settings button:focus-visible {
        background: rgba(255,255,255,0.18); border-color: rgba(255,255,255,0.34); }
      .public-icon-button:disabled, .public-quick-button:disabled, #public-settings button:disabled, #public-settings input:disabled, #public-settings select:disabled {
        cursor: not-allowed; opacity: 0.44; }
      #public-settings { display: grid; grid-template-columns: 1fr; gap: 0.72rem; }
      #public-settings .panel { border: 1px solid rgba(255,255,255,0.12); border-radius: 0.9rem;
        background: rgba(255,255,255,0.055); overflow: hidden; }
      #public-settings .panel-heading { margin: 0; font-size: 0.88rem; }
      #public-settings .panel-toggle { width: 100%; display: flex; align-items: center; justify-content: space-between;
        gap: 0.8rem; border: 0; border-radius: 0; background: transparent; padding: 0.72rem 0.8rem;
        color: rgba(255,255,255,0.86); text-align: left; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
      #public-settings .panel-toggle:hover, #public-settings .panel-toggle:focus-visible { background: rgba(255,255,255,0.08); }
      #public-settings .panel-chevron { transition: transform 0.18s ease; }
      #public-settings .panel[data-collapsed="true"] .panel-chevron { transform: rotate(-90deg); }
      #public-settings .panel-body { display: grid; grid-template-rows: 1fr; opacity: 1; transition: grid-template-rows 0.2s ease, opacity 0.18s ease; }
      #public-settings .panel[data-collapsed="true"] .panel-body { grid-template-rows: 0fr; opacity: 0; }
      #public-settings .panel-body-inner { min-height: 0; overflow: hidden; padding: 0 0.8rem 0.8rem; }
      #public-settings .panel[data-collapsed="true"] .panel-body-inner { padding-bottom: 0; }
      #public-settings .panel-subheading { margin: 0.85rem 0 0.55rem; font-size: 0.82rem; color: rgba(255,255,255,0.76); }
      #public-settings .row, #public-settings .seg { display: flex; flex-wrap: wrap; gap: 0.35rem; align-items: center; }
      #public-settings .seg button { flex: 1 1 auto; padding: 0 0.62rem; font-size: 0.82rem; }
      #public-settings button.active { background: rgba(255,255,255,0.24); border-color: rgba(255,255,255,0.5); }
      #public-settings .field { display: grid; gap: 0.4rem; color: rgba(255,255,255,0.74); font-size: 0.82rem; }
      #public-settings input[type="range"] { width: 100%; accent-color: #fff; cursor: auto; }
      #public-settings .muted { color: rgba(255,255,255,0.62); font-size: 0.78rem; line-height: 1.35; }
      @media (min-width: 860px) {
        #public-control-panel { width: min(30rem, calc(100vw - 2rem)); }
        #public-settings { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }
      @media (max-width: 700px) {
        #public-bottom-controller { gap: 0.55rem; min-width: auto; width: min(24rem, calc(100vw - 1.25rem)); padding: 0.55rem; }
        .public-playback-button { min-width: 3rem; min-height: 3rem; font-size: 1.15rem; }
        .public-playback-button.primary { min-width: 3.65rem; min-height: 3.65rem; font-size: 1.35rem; }
        #public-controls-toggle { top: auto; bottom: calc(max(1rem, env(safe-area-inset-bottom)) + 5.35rem); right: 50%; transform: translateX(50%); }
        #public-controls-toggle:hover, #public-controls-toggle:focus-visible { transform: translateX(50%) translateY(-1px); }
        #public-control-panel { position: absolute; inset: auto 0 0 0; width: auto; max-height: 58vh; border-radius: 1.25rem 1.25rem 0 0;
          padding: 1rem max(1rem, env(safe-area-inset-right)) max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
          transform: translateY(1rem); }
      }
      .hidden { display: none !important; }

      @media (max-width: 720px), (pointer: coarse) and (max-width: 900px) {
        .public-controls {
          top: auto;
          left: 0;
          right: 0;
          bottom: 0;
          width: auto;
          max-height: min(78dvh, 620px);
          padding: 18px max(16px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
          border-radius: 26px 26px 0 0;
          border-right: 0;
          border-bottom: 0;
          border-left: 0;
        }
        .controls-playback { grid-template-columns: repeat(3, minmax(72px, 1fr)); }
      }

      @media (min-width: 1200px) {
        .controls-toggle { padding-inline: 24px; }
        .public-controls { width: 420px; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="gl"></canvas>
      <div id="video-bg"></div>
      <video id="video" autoplay playsinline></video>
      <!-- Live Cast overlay: a one-off push from the phone, shown above the slideshow but
           below #public-controls (z-index 20) so the controls stay usable. -->
      <img id="live-cast-img" class="live-cast-layer" alt="" />
      <video id="live-cast-video" class="live-cast-layer" muted playsinline loop></video>
      <div id="clock" class="overlay hidden"></div>
      <div id="caption" class="overlay hidden"></div>
      <div id="qr" class="overlay hidden"><img alt="Scan to manage" /></div>
      <div id="status" class="overlay">Connecting…</div>
      <section id="public-controls" aria-label="Public slideshow controls">
        <nav id="public-bottom-controller" class="is-hidden" aria-label="Playback controls">
          <button id="public-bottom-previous" class="public-playback-button" type="button" data-control="previous" aria-label="Previous item">‹</button>
          <button id="public-bottom-play-pause" class="public-playback-button primary" type="button" data-control="play-pause" aria-label="Play or pause slideshow" aria-pressed="false">⏯</button>
          <button id="public-bottom-next" class="public-playback-button" type="button" data-control="next" aria-label="Next item">›</button>
        </nav>
        <button id="public-controls-toggle" type="button" aria-controls="public-control-panel" aria-expanded="false">Controls</button>
        <aside id="public-control-panel" aria-label="Slideshow controls" hidden>
          <div class="public-control-header">
            <div class="public-control-title">Frame Controls</div>
            <div class="public-control-note">Dims when idle</div>
          </div>
          <div id="public-playback" aria-label="Playback">
            <button id="public-previous" class="public-icon-button" type="button" data-control="previous" aria-label="Previous photo">‹</button>
            <button id="public-play-pause" class="public-icon-button" type="button" data-control="play-pause" aria-label="Play or pause">⏯</button>
            <button id="public-next" class="public-icon-button" type="button" data-control="next" aria-label="Next photo">›</button>
          </div>
          <div id="public-quick-actions" aria-label="Quick display actions">
            <div class="public-quick-row">
              <button id="public-fit-cover" class="public-quick-button" type="button" data-quick-action="fill-cover" aria-pressed="false">Cover/Crop</button>
              <button id="public-fit-contain" class="public-quick-button" type="button" data-quick-action="fill-contain" aria-pressed="false">Contain/Fit</button>
              <button id="public-smart-crop" class="public-quick-button" type="button" data-quick-action="smart-crop" aria-pressed="false">Smart Crop</button>
              <button id="public-reset-view" class="public-quick-button" type="button" data-quick-action="reset-view">Reset</button>
            </div>
            <section class="public-collapse" id="public-zoom-pan-section" data-collapsed="false">
              <h2 class="public-collapse-heading">
                <button id="public-zoom-pan-toggle" class="public-collapse-toggle" type="button" aria-controls="public-zoom-pan-body" aria-expanded="true">
                  <span>Zoom &amp; Pan</span>
                  <span class="public-collapse-chevron" aria-hidden="true">▾</span>
                </button>
              </h2>
              <div id="public-zoom-pan-body" class="public-collapse-body">
                <div class="public-collapse-body-inner public-zoom-pan-grid">
                  <button id="public-zoom-out" class="public-quick-button" type="button" data-quick-action="zoom-out">Zoom Out</button>
                  <button id="public-zoom-in" class="public-quick-button" type="button" data-quick-action="zoom-in">Zoom In</button>
                  <button id="public-pan-up" class="public-quick-button" type="button" data-quick-action="pan-up" aria-label="Pan up">↑</button>
                  <button id="public-pan-left" class="public-quick-button" type="button" data-quick-action="pan-left" aria-label="Pan left">←</button>
                  <button id="public-pan-down" class="public-quick-button" type="button" data-quick-action="pan-down" aria-label="Pan down">↓</button>
                  <button id="public-pan-right" class="public-quick-button" type="button" data-quick-action="pan-right" aria-label="Pan right">→</button>
                </div>
              </div>
            </section>
          </div>
          <div id="public-settings" aria-label="Slideshow settings"></div>
        </aside>
      </section>
    </div>
    <!-- Load the Cast receiver framework only on Chromecast/Android TV (CrKey) devices, so
         regular TV browsers never block on an external dependency. The receiver bridge in
         main.ts waits briefly for it to become available. -->
    <script>
      if (/\bCrKey\b/.test(navigator.userAgent)) {
        var s = document.createElement('script');
        s.src = 'https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js';
        document.head.appendChild(s);
      }
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
