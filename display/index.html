<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>4KFrame</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
      #app { position: fixed; inset: 0; }
      #gl { position: absolute; inset: 0; width: 100%; height: 100%; }
      /* Backdrop behind videos: opaque black base + optional blurred poster (blur mode). */
      #video-bg { position: absolute; inset: 0; background-color: #000;
        background-size: cover; background-position: center; filter: blur(28px); transform: scale(1.1);
        opacity: 0; transition: opacity 0.6s ease; }
      #video-bg.visible { opacity: 1; }
      video { position: absolute; inset: 0; object-fit: contain; opacity: 0; transition: opacity 0.6s ease; }
      video.visible { opacity: 1; }
      .overlay { position: absolute; color: #fff; font-family: system-ui, sans-serif;
        text-shadow: 0 2px 8px rgba(0,0,0,0.7); pointer-events: none; }
      #clock { top: 4vh; left: 4vw; font-size: 4vh; font-weight: 300; }
      #caption { bottom: 4vh; left: 4vw; font-size: 3vh; max-width: 60vw; }
      #qr { bottom: 3vh; right: 3vw; width: 12vh; height: 12vh; background: #fff; padding: 1vh; border-radius: 1vh; }
      #qr img { width: 100%; height: 100%; display: block; }
      #status { bottom: 3vh; left: 4vw; font-size: 2.4vh; opacity: 0.6; }
      #public-settings { position: absolute; top: 2vh; right: 2vw; width: min(24rem, 34vw); max-height: 92vh;
        overflow: auto; padding: .7rem; border-radius: 1rem; color: #fff; background: rgba(8,10,16,.58);
        border: 1px solid rgba(255,255,255,.16); backdrop-filter: blur(14px); font-family: system-ui, sans-serif;
        cursor: auto; opacity: .18; transition: opacity .2s ease; }
      #public-settings:focus-within, #public-settings:hover { opacity: .96; }
      #public-settings .panel { border-top: 1px solid rgba(255,255,255,.14); padding-top: .45rem; margin-top: .45rem; }
      #public-settings .panel:first-child { border-top: 0; margin-top: 0; padding-top: 0; }
      #public-settings .panel-heading { margin: 0 0 .45rem; font-size: .9rem; }
      #public-settings .panel-toggle { width: 100%; border: 0; padding: 0; background: transparent; color: inherit; font: inherit; text-align: left; pointer-events: none; }
      #public-settings .panel-chevron { display: none; }
      #public-settings .row { display: flex; flex-wrap: wrap; gap: .35rem; }
      #public-settings button { border: 1px solid rgba(255,255,255,.22); border-radius: 999px; padding: .35rem .55rem; color: #fff; background: rgba(255,255,255,.12); }
      #public-settings button.active { background: #fff; color: #111827; }
      #public-settings .field { display: grid; gap: .25rem; margin: .45rem 0; }
      #public-settings input[type=range] { width: 100%; }
      #public-settings .muted { color: rgba(255,255,255,.7); font-size: .78rem; }
      #public-settings .panel-subheading { margin: .65rem 0 .35rem; font-size: .82rem; }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="gl"></canvas>
      <div id="video-bg"></div>
      <video id="video" muted playsinline></video>
      <div id="clock" class="overlay hidden"></div>
      <div id="caption" class="overlay hidden"></div>
      <div id="qr" class="overlay hidden"><img alt="Scan to manage" /></div>
      <div id="status" class="overlay">Connecting…</div>
      <div id="public-settings" aria-label="Public display settings"></div>
    </div>
    <!-- Load the Cast receiver framework only on Chromecast/Android TV (CrKey) devices, so
         regular TV browsers never block on an external dependency. The receiver bridge in
         main.ts waits briefly for it to become available. -->
    <script>
      if (/\bCrKey\b/.test(navigator.userAgent)) {
        var s = document.createElement('script');
        s.src = 'https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js';
        document.head.appendChild(s);
      }
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
