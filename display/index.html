<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>4KFrame</title>
    <style>
      :root {
        color-scheme: dark;
        --display-bg: #000;
        --display-text: #f8fafc;
        --display-muted: #cbd5e1;
        --display-dim: #94a3b8;
        --display-panel: rgba(7, 10, 18, 0.82);
        --display-panel-strong: rgba(15, 23, 42, 0.94);
        --display-card: rgba(30, 41, 59, 0.72);
        --display-border: rgba(226, 232, 240, 0.18);
        --display-ring: rgba(125, 211, 252, 0.9);
        --display-primary: #38bdf8;
        --display-primary-strong: #0ea5e9;
        --display-shadow: 0 24px 80px rgba(0, 0, 0, 0.58);
        --display-radius: 22px;
        --display-touch: 44px;
      }

      html, body { margin: 0; height: 100%; background: var(--display-bg); overflow: hidden; cursor: none; }
      #app { position: fixed; inset: 0; overflow: hidden; }
      #gl { position: absolute; inset: 0; width: 100%; height: 100%; }
      /* Backdrop behind videos: opaque black base + optional blurred poster (blur mode). */
      #video-bg { position: absolute; inset: 0; background-color: #000;
        background-size: cover; background-position: center; filter: blur(28px); transform: scale(1.1);
        opacity: 0; transition: opacity 0.6s ease; }
      #video-bg.visible { opacity: 1; }
      video { position: absolute; inset: 0; object-fit: contain; opacity: 0; transition: opacity 0.6s ease; }
      video.visible { opacity: 1; }
      .overlay { position: absolute; color: #fff; font-family: system-ui, sans-serif;
        text-shadow: 0 2px 8px rgba(0,0,0,0.7); pointer-events: none; }
      #clock { top: 4vh; left: 4vw; font-size: 4vh; font-weight: 300; }
      #caption { bottom: 4vh; left: 4vw; font-size: 3vh; max-width: 60vw; }
      #qr { bottom: 3vh; right: 3vw; width: 12vh; height: 12vh; background: #fff; padding: 1vh; border-radius: 1vh; }
      #qr img { width: 100%; height: 100%; display: block; }
      #status { bottom: 3vh; left: 4vw; font-size: 2.4vh; opacity: 0.6; }

      .controls-toggle {
        position: absolute;
        z-index: 40;
        top: max(18px, env(safe-area-inset-top));
        right: max(18px, env(safe-area-inset-right));
        min-height: var(--display-touch);
        min-width: var(--display-touch);
        padding: 0 20px;
        border: 1px solid var(--display-border);
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.7);
        color: var(--display-text);
        font: 700 clamp(15px, 1.8vw, 20px)/1 system-ui, sans-serif;
        letter-spacing: 0.01em;
        box-shadow: var(--display-shadow);
        -webkit-backdrop-filter: blur(18px);
        backdrop-filter: blur(18px);
        cursor: pointer;
      }

      .public-controls {
        position: absolute;
        z-index: 35;
        top: calc(max(18px, env(safe-area-inset-top)) + 62px);
        right: max(18px, env(safe-area-inset-right));
        width: min(380px, calc(100vw - 36px));
        bottom: max(20vh, calc(env(safe-area-inset-bottom) + 18px));
        max-height: calc(100dvh - 100px - max(20vh, calc(env(safe-area-inset-bottom) + 18px)));
        display: flex;
        flex-direction: column;
        gap: 14px;
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: 16px;
        border: 1px solid var(--display-border);
        border-radius: var(--display-radius);
        background: var(--display-panel);
        color: var(--display-text);
        font-family: system-ui, sans-serif;
        box-shadow: var(--display-shadow);
        -webkit-backdrop-filter: blur(22px) saturate(130%);
        backdrop-filter: blur(22px) saturate(130%);
        cursor: auto;
      }

      .public-controls[hidden] { display: none !important; }
      .controls-toggle:focus-visible,
      .public-controls button:focus-visible {
        outline: 3px solid var(--display-ring);
        outline-offset: 3px;
      }

      .controls-playback {
        position: sticky;
        top: -16px;
        z-index: 1;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        padding: 16px 0 12px;
        background: linear-gradient(var(--display-panel-strong), rgba(15, 23, 42, 0.76));
        border-bottom: 1px solid var(--display-border);
      }

      .control-card {
        display: grid;
        gap: 12px;
        padding: 14px;
        border: 1px solid var(--display-border);
        border-radius: 18px;
        background: var(--display-card);
      }

      .control-card h2 {
        margin: 0;
        color: var(--display-muted);
        font-size: clamp(14px, 1.6vw, 18px);
        font-weight: 750;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .control-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .control-grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }

      .public-controls button {
        min-height: var(--display-touch);
        border: 1px solid var(--display-border);
        border-radius: 14px;
        background: rgba(15, 23, 42, 0.76);
        color: var(--display-text);
        font: 700 clamp(14px, 1.5vw, 18px)/1.15 system-ui, sans-serif;
        cursor: pointer;
      }

      .public-controls button[aria-pressed="true"] {
        border-color: rgba(56, 189, 248, 0.72);
        background: linear-gradient(180deg, var(--display-primary), var(--display-primary-strong));
        color: #00111a;
      }

      .control-value { align-self: center; color: var(--display-muted); font-size: 16px; text-align: center; }
      .hidden { display: none !important; }

      @media (max-width: 720px), (pointer: coarse) and (max-width: 900px) {
        .public-controls {
          top: auto;
          left: 0;
          right: 0;
          bottom: 0;
          width: auto;
          max-height: min(78dvh, 620px);
          padding: 18px max(16px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
          border-radius: 26px 26px 0 0;
          border-right: 0;
          border-bottom: 0;
          border-left: 0;
        }
        .controls-playback { grid-template-columns: repeat(3, minmax(72px, 1fr)); }
      }

      @media (min-width: 1200px) {
        .controls-toggle { padding-inline: 24px; }
        .public-controls { width: 420px; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="gl"></canvas>
      <div id="video-bg"></div>
      <video id="video" muted playsinline></video>
      <div id="clock" class="overlay hidden"></div>
      <div id="caption" class="overlay hidden"></div>
      <div id="qr" class="overlay hidden"><img alt="Scan to manage" /></div>
      <div id="status" class="overlay">Connecting…</div>
      <button
        id="controls-toggle"
        class="controls-toggle"
        type="button"
        aria-controls="public-controls"
        aria-expanded="false"
        aria-label="Open slideshow controls"
      >Controls</button>
      <section id="public-controls" class="public-controls" aria-label="Slideshow controls" hidden>
        <div class="controls-playback" aria-label="Playback controls">
          <button id="control-previous" type="button" aria-label="Show previous item">← Previous</button>
          <button id="control-pause" type="button" aria-label="Pause slideshow" aria-pressed="false">Pause</button>
          <button id="control-next" type="button" aria-label="Show next item">Next →</button>
        </div>
        <section class="control-card" aria-label="Timing controls">
          <h2>Timing</h2>
          <div class="control-grid three">
            <button type="button" data-period="-5" aria-label="Show photos for five fewer seconds">−5s</button>
            <div id="period-value" class="control-value" aria-live="polite">15s</div>
            <button type="button" data-period="5" aria-label="Show photos for five more seconds">+5s</button>
          </div>
        </section>
        <section class="control-card" aria-label="Appearance controls">
          <h2>Appearance</h2>
          <div class="control-grid">
            <button type="button" data-fill-mode="cover" aria-label="Fill the screen with cropped media">Fill</button>
            <button type="button" data-fill-mode="contain" aria-label="Fit the whole media item on screen">Fit</button>
            <button type="button" data-zoom="in" aria-label="Zoom in">Zoom +</button>
            <button type="button" data-zoom="out" aria-label="Zoom out">Zoom −</button>
          </div>
          <button type="button" data-reset-view aria-label="Reset zoom and pan">Reset view</button>
        </section>
        <section class="control-card" aria-label="Motion controls">
          <h2>Motion</h2>
          <div class="control-grid three">
            <button type="button" data-motion="off" aria-label="Turn motion off">Off</button>
            <button type="button" data-motion="zoom" aria-label="Use slow zoom motion">Zoom</button>
            <button type="button" data-motion="zoompan" aria-label="Use pan and zoom motion">Pan + Zoom</button>
          </div>
        </section>
      </section>
    </div>
    <!-- Load the Cast receiver framework only on Chromecast/Android TV (CrKey) devices, so
         regular TV browsers never block on an external dependency. The receiver bridge in
         main.ts waits briefly for it to become available. -->
    <script>
      if (/\bCrKey\b/.test(navigator.userAgent)) {
        var s = document.createElement('script');
        s.src = 'https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js';
        document.head.appendChild(s);
      }
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
