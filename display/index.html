<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>4KFrame</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
      #app { position: fixed; inset: 0; }
      #gl { position: absolute; inset: 0; width: 100%; height: 100%; }
      /* Backdrop behind videos: opaque black base + optional blurred poster (blur mode). */
      #video-bg { position: absolute; inset: 0; background-color: #000;
        background-size: cover; background-position: center; filter: blur(28px); transform: scale(1.1);
        opacity: 0; transition: opacity 0.6s ease; }
      #video-bg.visible { opacity: 1; }
      video { position: absolute; inset: 0; object-fit: contain; opacity: 0; transition: opacity 0.6s ease; }
      video.visible { opacity: 1; }
      .overlay { position: absolute; color: #fff; font-family: system-ui, sans-serif;
        text-shadow: 0 2px 8px rgba(0,0,0,0.7); pointer-events: none; }
      #clock { top: 4vh; left: 4vw; font-size: 4vh; font-weight: 300; }
      #caption { bottom: 4vh; left: 4vw; font-size: 3vh; max-width: 60vw; }
      #qr { bottom: 3vh; right: 3vw; width: 12vh; height: 12vh; background: #fff; padding: 1vh; border-radius: 1vh; }
      #qr img { width: 100%; height: 100%; display: block; }
      #status { bottom: 3vh; left: 4vw; font-size: 2.4vh; opacity: 0.6; }
      #display-controls { position: absolute; left: 50%; bottom: max(2vh, env(safe-area-inset-bottom)); transform: translateX(-50%);
        display: grid; grid-template-columns: repeat(5, minmax(2.75rem, 1fr)); gap: 0.45rem; align-items: center;
        font-family: system-ui, sans-serif; pointer-events: auto; cursor: auto; opacity: 0.82; transition: opacity 0.2s ease; }
      #display-controls:hover, #display-controls:focus-within { opacity: 1; }
      #display-controls button { min-width: 2.75rem; min-height: 2.75rem; border: 1px solid rgba(255,255,255,0.26);
        border-radius: 999px; color: #fff; background: rgba(10,14,24,0.58); font: inherit; font-size: 1rem;
        box-shadow: 0 0.35rem 1.4rem rgba(0,0,0,0.35); backdrop-filter: blur(16px); }
      #display-controls button.control-wide { grid-column: span 2; }
      #display-controls button.control-active { background: rgba(80,125,255,0.72); border-color: rgba(255,255,255,0.52); }
      #display-controls button:disabled { opacity: 0.38; cursor: not-allowed; }
      #display-controls button:not(:disabled):active { transform: scale(0.96); }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="gl"></canvas>
      <div id="video-bg"></div>
      <video id="video" muted playsinline></video>
      <div id="clock" class="overlay hidden"></div>
      <div id="caption" class="overlay hidden"></div>
      <div id="qr" class="overlay hidden"><img alt="Scan to manage" /></div>
      <div id="status" class="overlay">Connecting…</div>
      <div id="display-controls" aria-label="Display controls">
        <button type="button" data-control-action="previous" aria-label="Previous item">◀</button>
        <button type="button" data-control-action="toggle-pause" aria-label="Pause slideshow" aria-pressed="false">⏯</button>
        <button type="button" data-control-action="next" aria-label="Next item">▶</button>
        <button type="button" data-control-action="zoom-out" aria-label="Zoom out">−</button>
        <button type="button" data-control-action="zoom-in" aria-label="Zoom in">＋</button>
        <button type="button" data-control-action="pan-left" aria-label="Pan left">←</button>
        <button type="button" data-control-action="pan-up" aria-label="Pan up">↑</button>
        <button type="button" data-control-action="pan-down" aria-label="Pan down">↓</button>
        <button type="button" data-control-action="pan-right" aria-label="Pan right">→</button>
        <button type="button" class="control-wide" data-control-action="reset-zoom-pan" aria-label="Reset zoom and pan">Reset</button>
      </div>
    </div>
    <!-- Load the Cast receiver framework only on Chromecast/Android TV (CrKey) devices, so
         regular TV browsers never block on an external dependency. The receiver bridge in
         main.ts waits briefly for it to become available. -->
    <script>
      if (/\bCrKey\b/.test(navigator.userAgent)) {
        var s = document.createElement('script');
        s.src = 'https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js';
        document.head.appendChild(s);
      }
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
