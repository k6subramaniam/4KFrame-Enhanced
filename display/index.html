<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>4KFrame</title>
    <style>
      :root {
        color-scheme: dark;
        --display-bg: #000;
        --display-text: #f8fafc;
        --display-muted: #cbd5e1;
        --display-panel: rgba(7, 10, 18, 0.88);
        --display-panel-strong: rgba(15, 23, 42, 0.96);
        --display-border: rgba(226, 232, 240, 0.18);
        --display-ring: rgba(125, 211, 252, 0.95);
        --display-primary: #38bdf8;
        --display-shadow: 0 24px 80px rgba(0, 0, 0, 0.58);
      }

      html, body {
        margin: 0;
        height: 100%;
        background: var(--display-bg);
        overflow: hidden;
        cursor: none;
      }

      @media (min-width: 1600px) {
        :root { font-size: clamp(16px, 0.85vw, 30px); }
      }

      #app { position: fixed; inset: 0; overflow: hidden; }
      #gl, #video-bg, #video { touch-action:none; }
      #gl { position: absolute; inset: 0; width: 100%; height: 100%; }
      #video-bg {
        position: absolute;
        inset: 0;
        background-color: #000;
        background-size: cover;
        background-position: center;
        filter: blur(28px);
        transform: scale(1.1);
        opacity: 0;
        transition: opacity 0.6s ease;
      }
      #video-bg.visible { opacity: 1; }
      video {
        position: absolute;
        inset: 0;
        object-fit: contain;
        opacity: 0;
        transition: opacity 0.6s ease;
      }
      video.visible { opacity: 1; }

      .overlay {
        position: absolute;
        color: #fff;
        font-family: system-ui, sans-serif;
        text-shadow: 0 2px 8px rgba(0,0,0,0.7);
        pointer-events: none;
        z-index: 16;
      }
      #clock { top: 4vh; left: 4vw; font-size: 4vh; font-weight: 300; }
      #caption { bottom: 4vh; left: 4vw; font-size: 3vh; max-width: 60vw; }
      #qr {
        bottom: 3vh;
        right: 3vw;
        width: 12vh;
        height: 12vh;
        background: #fff;
        padding: 1vh;
        border-radius: 1vh;
      }
      #qr img { width: 100%; height: 100%; display: block; }
      #status { display: none !important; }

      .live-cast-layer {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
        z-index: 15;
        display: none;
      }
      .live-cast-layer.visible { display: block; }

      #public-controls {
        position: absolute;
        inset: 0;
        z-index: 20;
        pointer-events: none;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #fff;
      }
      #public-controls, #public-controls * { box-sizing: border-box; }
      #public-controls button, #public-controls input, #public-controls select { font: inherit; }
      #public-controls button:focus-visible,
      #public-controls input:focus-visible,
      #public-controls select:focus-visible {
        outline: max(3px, 0.35vmin) solid var(--display-ring);
        outline-offset: max(3px, 0.3vmin);
        box-shadow: 0 0 0 max(6px, 0.7vmin) rgba(14,165,233,0.22);
      }

      /* One predictable dock for the actions people use most. */
      #public-control-dock {
        position: absolute;
        left: 50%;
        bottom: max(1.1rem, env(safe-area-inset-bottom));
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.55rem;
        pointer-events: none;
      }
      #public-bottom-controller {
        display: grid;
        grid-template-columns: repeat(3, minmax(3.55rem, auto));
        align-items: stretch;
        justify-content: center;
        gap: 0.35rem;
        padding: 0.45rem;
        pointer-events: auto;
        cursor: auto;
        border: 1px solid rgba(255,255,255,0.16);
        border-radius: 1.35rem;
        background: linear-gradient(180deg, rgba(15,23,42,0.9), rgba(3,7,18,0.82));
        box-shadow: 0 18px 54px rgba(0,0,0,0.5);
        backdrop-filter: blur(20px);
        opacity: 0.98;
        transition: opacity 220ms ease, transform 220ms ease, filter 220ms ease;
      }
      #public-bottom-controller.is-dim { opacity: 0.45; filter: saturate(0.85); transform: translateY(0.18rem); }
      #public-bottom-controller.is-hidden { opacity: 0; pointer-events: none; transform: translateY(0.8rem) scale(0.97); }
      #public-bottom-controller:focus-within { opacity: 1; filter: none; transform: none; }

      #public-video-timeline {
        grid-column: 1 / -1;
        display: grid;
        grid-template-columns: auto minmax(9rem, 1fr) auto;
        gap: 0.55rem;
        align-items: center;
        padding: 0.12rem 0.35rem 0.08rem;
        min-width: min(30rem, 70vw);
        color: rgba(255,255,255,0.72);
        font-size: 0.67rem;
        font-variant-numeric: tabular-nums;
      }
      #public-video-timeline.hidden { display:none !important; }
      #public-video-seek {
        width: 100%;
        min-height: 1.7rem;
        margin: 0;
        accent-color: var(--display-primary);
        cursor: pointer;
      }

      .public-playback-button {
        width: 3.55rem;
        min-width: 3.55rem;
        min-height: 3.55rem;
        display: inline-flex;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        gap: 0;
        padding: 0;
        border: 1px solid rgba(255,255,255,0.14);
        border-radius: 999px;
        color: #fff;
        background: rgba(255,255,255,0.07);
        cursor: auto;
        font-size: 1.45rem;
        line-height: 1;
        text-shadow: 0 1px 6px rgba(0,0,0,0.45);
        transition: background 160ms ease, border-color 160ms ease, transform 160ms ease, opacity 160ms ease;
      }
      .public-playback-button::after { display: none; }
      .public-playback-button:hover,
      .public-playback-button:focus-visible {
        background: rgba(255,255,255,0.18);
        border-color: rgba(255,255,255,0.4);
        transform: translateY(-1px);
      }
      .public-playback-button:disabled { opacity: 0.42; cursor: not-allowed; }
      .public-playback-button.primary {
        min-width: 3.9rem;
        width: 3.9rem;
        background: rgba(56,189,248,0.22);
        border-color: rgba(125,211,252,0.5);
      }

      #public-controls-toggle {
        width: 3.55rem;
        min-width: 3.55rem;
        min-height: 3.55rem;
        pointer-events: auto;
        cursor: auto;
        border: 1px solid rgba(255,255,255,0.16);
        border-radius: 999px;
        padding: 0;
        color: rgba(255,255,255,0.88);
        background: linear-gradient(180deg, rgba(15,23,42,0.88), rgba(3,7,18,0.8));
        box-shadow: 0 18px 54px rgba(0,0,0,0.42);
        backdrop-filter: blur(20px);
        opacity: 0.92;
        font-size: 1rem;
        font-weight: 700;
        letter-spacing: 0.025em;
        transition: opacity 180ms ease, background 180ms ease, border-color 180ms ease, transform 180ms ease;
      }
      #public-controls-toggle::before { display: none; }
      #public-controls-toggle.is-hidden {
        opacity: 0;
        pointer-events: none;
        transform: translateY(0.8rem) scale(0.96);
      }
      #public-controls-toggle.is-active,
      #public-controls-toggle:hover,
      #public-controls-toggle:focus-visible,
      #public-controls-toggle[aria-expanded="true"] {
        opacity: 1;
        color: #fff;
        border-color: rgba(125,211,252,0.44);
        background: linear-gradient(180deg, rgba(30,41,59,0.96), rgba(15,23,42,0.94));
        transform: translateY(-1px);
      }

      /* Secondary controls live in one adjustments panel instead of repeating playback. */
      #public-control-panel {
        position: absolute;
        left: 50%;
        bottom: max(7.2rem, calc(env(safe-area-inset-bottom) + 7rem));
        transform: translateX(-50%);
        width: min(34rem, calc(100vw - 2rem));
        max-height: min(68vh, calc(100vh - 9rem));
        overflow: auto;
        pointer-events: auto;
        cursor: auto;
        border: 1px solid rgba(255,255,255,0.14);
        border-radius: 1.1rem;
        background: rgba(9, 12, 18, 0.94);
        box-shadow: var(--display-shadow);
        backdrop-filter: blur(24px);
        padding: 1rem;
        scrollbar-width: thin;
      }
      #public-control-panel[hidden] { display: none; }
      .public-control-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 0.9rem;
      }
      .public-control-title { font-size: 1rem; font-weight: 750; letter-spacing: 0.02em; }
      .public-control-note { margin-top: 0.16rem; font-size: 0.74rem; color: rgba(255,255,255,0.58); }
      .public-section-label {
        margin: 0 0 0.5rem;
        font-size: 0.7rem;
        font-weight: 750;
        color: rgba(255,255,255,0.58);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      #public-quick-actions { display: grid; gap: 0.65rem; margin-bottom: 0.8rem; }
      .public-quick-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0.5rem; }
      .public-quick-button,
      #public-settings button {
        min-height: 3rem;
        border: 1px solid rgba(255,255,255,0.14);
        border-radius: 0.85rem;
        color: #fff;
        background: rgba(255,255,255,0.065);
        cursor: auto;
      }
      .public-quick-button {
        padding: 0.55rem 0.48rem;
        font-size: 0.78rem;
        line-height: 1.15;
        font-weight: 650;
      }
      .public-quick-button.is-selected,
      .public-quick-button[aria-pressed="true"] {
        border-color: rgba(125,211,252,0.72);
        background: rgba(14,165,233,0.32);
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1);
      }
      .public-quick-button:hover,
      .public-quick-button:focus-visible,
      #public-settings button:hover,
      #public-settings button:focus-visible {
        background: rgba(255,255,255,0.16);
        border-color: rgba(255,255,255,0.34);
      }
      .public-quick-button:disabled,
      #public-settings button:disabled,
      #public-settings input:disabled,
      #public-settings select:disabled {
        cursor: not-allowed;
        opacity: 0.4;
      }

      .public-collapse {
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 0.95rem;
        background: rgba(255,255,255,0.045);
        overflow: hidden;
      }
      .public-collapse-heading { margin: 0; font-size: 0.88rem; }
      .public-collapse-toggle {
        width: 100%;
        min-height: 3rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.8rem;
        border: 0;
        background: transparent;
        padding: 0.75rem 0.85rem;
        color: rgba(255,255,255,0.9);
        cursor: auto;
        text-align: left;
        font-weight: 700;
      }
      .public-collapse-toggle:hover,
      .public-collapse-toggle:focus-visible { background: rgba(255,255,255,0.08); }
      .public-collapse-chevron { transition: transform 0.18s ease; }
      .public-collapse[data-collapsed="true"] .public-collapse-chevron { transform: rotate(-90deg); }
      .public-collapse-body { display: grid; grid-template-rows: 1fr; opacity: 1; transition: grid-template-rows 0.2s ease, opacity 0.18s ease; }
      .public-collapse[data-collapsed="true"] .public-collapse-body { grid-template-rows: 0fr; opacity: 0; }
      .public-collapse-body-inner { min-height: 0; overflow: hidden; padding: 0 0.75rem 0.75rem; }
      .public-collapse[data-collapsed="true"] .public-collapse-body-inner { padding-bottom: 0; }
      .public-zoom-pan-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.5rem; }

      #public-settings {
        display: grid;
        grid-template-columns: 1fr;
        gap: 0.7rem;
        margin-top: 0.85rem;
        padding-top: 0.85rem;
        border-top: 1px solid rgba(255,255,255,0.1);
      }
      #public-settings .panel {
        border: 1px solid rgba(255,255,255,0.11);
        border-radius: 0.95rem;
        background: rgba(255,255,255,0.045);
        overflow: hidden;
      }
      #public-settings .panel-heading { margin: 0; font-size: 0.88rem; }
      #public-settings .panel-toggle {
        width: 100%;
        min-height: 3rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.8rem;
        border: 0;
        border-radius: 0;
        background: transparent;
        padding: 0.75rem 0.85rem;
        color: rgba(255,255,255,0.9);
        text-align: left;
        font-weight: 700;
      }
      #public-settings .panel-toggle:hover,
      #public-settings .panel-toggle:focus-visible { background: rgba(255,255,255,0.08); }
      #public-settings .panel-chevron { transition: transform 0.18s ease; }
      #public-settings .panel[data-collapsed="true"] .panel-chevron { transform: rotate(-90deg); }
      #public-settings .panel-body { display: grid; grid-template-rows: 1fr; opacity: 1; transition: grid-template-rows 0.2s ease, opacity 0.18s ease; }
      #public-settings .panel[data-collapsed="true"] .panel-body { grid-template-rows: 0fr; opacity: 0; }
      #public-settings .panel-body-inner { min-height: 0; overflow: hidden; padding: 0 0.85rem 0.85rem; }
      #public-settings .panel[data-collapsed="true"] .panel-body-inner { padding-bottom: 0; }
      #public-settings .panel-subheading { margin: 0.85rem 0 0.55rem; font-size: 0.8rem; color: rgba(255,255,255,0.76); }
      #public-settings .row,
      #public-settings .seg { display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; }
      #public-settings .seg button { flex: 1 1 auto; padding: 0 0.62rem; font-size: 0.78rem; }
      #public-settings button.active { background: rgba(14,165,233,0.3); border-color: rgba(125,211,252,0.62); }
      #public-settings .field { display: grid; gap: 0.45rem; color: rgba(255,255,255,0.76); font-size: 0.8rem; }
      #public-settings input[type="range"] { width: 100%; min-height: 2.5rem; accent-color: var(--display-primary); cursor: auto; }
      #public-settings .muted { color: rgba(255,255,255,0.6); font-size: 0.76rem; line-height: 1.4; }

      @media (min-width: 900px) {
        #public-settings { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }

      @media (max-width: 700px) {
        #public-control-dock {
          width: calc(100vw - 0.9rem);
          gap: 0.35rem;
          bottom: max(0.55rem, env(safe-area-inset-bottom));
        }
        #public-bottom-controller {
          flex: 1 1 auto;
          min-width: 0;
          width: 100%;
          grid-template-columns: repeat(3, minmax(0, 1fr));
          gap: 0.25rem;
          padding: 0.32rem;
          border-radius: 1.1rem;
        }
        #public-video-timeline {
          min-width: 0;
          width: 100%;
          grid-template-columns: auto minmax(0, 1fr) auto;
          padding-inline: 0.3rem;
        }
        .public-playback-button {
          flex: 1 1 0;
          min-width: 0;
          min-height: 3.5rem;
          padding-inline: 0.35rem;
          border-radius: 0.82rem;
          font-size: 1.25rem;
        }
        .public-playback-button.primary { min-width: 0; }
        .public-playback-button::after { font-size: 0.6rem; }
        #public-controls-toggle {
          min-width: 3.5rem;
          min-height: 3.5rem;
          padding-inline: 0.5rem;
          border-radius: 1.1rem;
          font-size: 0.68rem;
        }
        #public-control-panel {
          bottom: max(6.1rem, calc(env(safe-area-inset-bottom) + 5.9rem));
          width: calc(100vw - 0.9rem);
          max-height: min(68dvh, calc(100vh - 7.4rem));
          border-radius: 1.2rem;
          padding: 0.8rem;
        }
        .public-quick-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .public-zoom-pan-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }

      @media (prefers-reduced-motion: reduce) {
        #public-bottom-controller,
        #public-controls-toggle,
        .public-playback-button,
        .public-collapse-body,
        #public-settings .panel-body { transition: none; }
      }

      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="gl"></canvas>
      <div id="video-bg"></div>
      <video id="video" autoplay playsinline></video>
      <img id="live-cast-img" class="live-cast-layer" alt="" />
      <video id="live-cast-video" class="live-cast-layer" muted playsinline loop></video>
      <div id="clock" class="overlay hidden"></div>
      <div id="caption" class="overlay hidden"></div>
      <div id="qr" class="overlay hidden"><img alt="Scan to manage" /></div>
      <div id="status" class="overlay hidden"></div>

      <section id="public-controls" aria-label="Public slideshow controls">
        <div id="public-control-dock">
          <nav id="public-bottom-controller" class="is-hidden" aria-label="Playback controls">
            <div id="public-video-timeline" class="hidden" aria-label="Video timeline">
              <span id="public-video-current">0:00</span>
              <input id="public-video-seek" type="range" min="0" max="1000" step="1" value="0" tabindex="-1" aria-label="Video position" />
              <span id="public-video-duration">0:00</span>
            </div>
            <button id="public-bottom-previous" class="public-playback-button" type="button" data-control="previous" data-label="Previous" aria-label="Previous item">‹</button>
            <button id="public-bottom-play-pause" class="public-playback-button primary" type="button" data-control="play-pause" data-label="Play / Pause" aria-label="Play or pause slideshow" aria-pressed="false">⏯</button>
            <button id="public-bottom-next" class="public-playback-button" type="button" data-control="next" data-label="Next" aria-label="Next item">›</button>
          </nav>
          <button id="public-controls-toggle" class="is-hidden" type="button" aria-controls="public-control-panel" aria-expanded="false" aria-label="Open slideshow controls">•••</button>
        </div>

        <aside id="public-control-panel" aria-label="Display adjustments" hidden>
          <div class="public-control-header">
            <div>
              <div class="public-control-title">Settings</div>
            </div>
          </div>

          <div id="public-quick-actions" aria-label="Quick display actions">
            <div class="public-section-label">Framing</div>
            <div class="public-quick-row">
              <button id="public-fit-cover" class="public-quick-button" type="button" data-quick-action="fill-cover" aria-pressed="false">Fill screen</button>
              <button id="public-fit-contain" class="public-quick-button" type="button" data-quick-action="fill-contain" aria-pressed="false">Fit photo</button>
              <button id="public-smart-crop" class="public-quick-button" type="button" data-quick-action="smart-crop" aria-pressed="false">Smart crop</button>
              <button id="public-reset-view" class="public-quick-button" type="button" data-quick-action="reset-view">Reset view</button>
            </div>

            <section class="public-collapse" id="public-zoom-pan-section" data-collapsed="false">
              <h2 class="public-collapse-heading">
                <button id="public-zoom-pan-toggle" class="public-collapse-toggle" type="button" aria-controls="public-zoom-pan-body" aria-expanded="true">
                  <span>Zoom &amp; Pan</span>
                  <span class="public-collapse-chevron" aria-hidden="true">▾</span>
                </button>
              </h2>
              <div id="public-zoom-pan-body" class="public-collapse-body">
                <div class="public-collapse-body-inner public-zoom-pan-grid">
                  <button id="public-zoom-out" class="public-quick-button" type="button" data-quick-action="zoom-out">− Zoom</button>
                  <button id="public-zoom-in" class="public-quick-button" type="button" data-quick-action="zoom-in">+ Zoom</button>
                  <button id="public-pan-up" class="public-quick-button" type="button" data-quick-action="pan-up" aria-label="Pan up">↑ Pan</button>
                  <button id="public-pan-down" class="public-quick-button" type="button" data-quick-action="pan-down" aria-label="Pan down">↓ Pan</button>
                  <button id="public-pan-left" class="public-quick-button" type="button" data-quick-action="pan-left" aria-label="Pan left">← Pan</button>
                  <button id="public-pan-right" class="public-quick-button" type="button" data-quick-action="pan-right" aria-label="Pan right">→ Pan</button>
                </div>
              </div>
            </section>
          </div>

          <div id="public-settings" aria-label="Slideshow settings"></div>
        </aside>
      </section>
    </div>

    <script>
      if (/\bCrKey\b/.test(navigator.userAgent)) {
        var s = document.createElement('script');
        s.src = 'https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js';
        document.head.appendChild(s);
      }
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
