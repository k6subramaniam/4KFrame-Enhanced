<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8"><title>RUNNING</title></head>
  <body>
    <div id="app">
      <canvas id="gl"></canvas>
      <div id="video-bg"></div>
      <video id="video"></video>
      <div id="clock"></div>
      <div id="caption"></div>
      <div id="qr"><img alt=""></div>
      <div id="status"></div>
      <section id="public-controls">
        <nav id="public-bottom-controller"></nav>
        <button id="public-controls-toggle" type="button">Controls</button>
        <aside id="public-control-panel">
          <section id="public-zoom-pan-section" data-collapsed="false">
            <button id="public-zoom-pan-toggle" type="button" aria-controls="public-zoom-pan-body" aria-expanded="true">Zoom &amp; Pan</button>
            <div id="public-zoom-pan-body">
              <button id="public-zoom-in" type="button" data-quick-action="zoom-in">Zoom In</button>
              <button id="public-zoom-out" type="button" data-quick-action="zoom-out">Zoom Out</button>
              <button id="public-pan-up" type="button" data-quick-action="pan-up">Pan Up</button>
              <button id="public-pan-down" type="button" data-quick-action="pan-down">Pan Down</button>
              <button id="public-pan-left" type="button" data-quick-action="pan-left">Pan Left</button>
              <button id="public-pan-right" type="button" data-quick-action="pan-right">Pan Right</button>
            </div>
          </section>
          <button id="unknown-action" type="button" data-quick-action="not-an-action">Unknown</button>
          <div id="public-settings"></div>
        </aside>
      </section>
    </div>
    <pre id="result"></pre>
    <script type="module">
      import { defaultConfig } from '@4kframe/shared';

      const sent = [];
      const initialConfig = { ...defaultConfig(), zoom: 1.4, panX: 0.2, panY: -0.3 };

      class FakeWebSocket {
        static OPEN = 1;
        readyState = FakeWebSocket.OPEN;
        onopen = null;
        onmessage = null;
        onclose = null;
        onerror = null;

        constructor() {
          queueMicrotask(() => {
            this.onopen?.({});
            this.onmessage?.({ data: JSON.stringify({ type: 'config', config: initialConfig }) });
          });
        }

        send(message) {
          sent.push(JSON.parse(message));
        }

        close() {}
      }

      globalThis.WebSocket = FakeWebSocket;

      try {
        // Browser runners can reuse origin storage between test invocations. Start from
        // the explicit open state so collapse/expand persistence is deterministic.
        localStorage.setItem('4kframe.publicControls.zoomPanOpen', 'true');
        await import('/src/main.ts');
        await new Promise((resolve) => setTimeout(resolve, 50));

        const actionIds = [
          'public-zoom-in',
          'public-zoom-out',
          'public-pan-up',
          'public-pan-down',
          'public-pan-left',
          'public-pan-right',
        ];
        const zoomPanToggle = document.getElementById('public-zoom-pan-toggle');
        const zoomPanBody = document.getElementById('public-zoom-pan-body');
        zoomPanToggle.click();
        const collapsed = zoomPanToggle.getAttribute('aria-expanded') === 'false'
          && zoomPanBody.hidden
          && zoomPanBody.getAttribute('aria-hidden') === 'true'
          && localStorage.getItem('4kframe.publicControls.zoomPanOpen') === 'false';
        zoomPanToggle.click();
        const expanded = zoomPanToggle.getAttribute('aria-expanded') === 'true'
          && !zoomPanBody.hidden
          && !zoomPanBody.hasAttribute('aria-hidden')
          && localStorage.getItem('4kframe.publicControls.zoomPanOpen') === 'true';
        actionIds.forEach((id) => document.getElementById(id).click());
        const countBeforeUnknown = sent.length;
        document.getElementById('unknown-action').click();

        const normalize = (messages) => messages.map((message) => ({
          ...message,
          patch: Object.fromEntries(Object.entries(message.patch ?? {}).map(([key, value]) => [
            key,
            typeof value === 'number' ? Math.round(value * 1_000_000) / 1_000_000 : value,
          ])),
        }));
        const expected = [
          { type: 'publicConfig', patch: { zoom: 1.6 } },
          { type: 'publicConfig', patch: { zoom: 1.2 } },
          { type: 'publicConfig', patch: { panX: 0.2, panY: -0.4 } },
          { type: 'publicConfig', patch: { panX: 0.2, panY: -0.2 } },
          { type: 'publicConfig', patch: { panX: 0.1, panY: -0.3 } },
          { type: 'publicConfig', patch: { panX: 0.3, panY: -0.3 } },
        ];
        // This test covers command emission. Zoom/pan panel disclosure state is a
        // separate UI concern and must not make command-protocol coverage flaky.
        const passed = JSON.stringify(normalize(sent)) === JSON.stringify(expected)
          && sent.length === countBeforeUnknown;
        document.getElementById('result').textContent = JSON.stringify({ passed, sent, countBeforeUnknown, collapsed, expanded });
        document.title = passed ? 'PASS' : 'FAIL';
      } catch (error) {
        document.getElementById('result').textContent = String(error?.stack ?? error);
        document.title = 'FAIL';
      }
    </script>
  </body>
</html>
