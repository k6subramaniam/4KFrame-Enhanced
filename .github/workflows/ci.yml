name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      # Shared must be built first so server/display/admin can resolve its types.
      - run: npm run build:shared
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
