name: Media usage validation
on:
  push:
    branches: [feat/media-usage-controls-20261113]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Align browser fixtures with heartbeat and gesture-gated audio
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('display/tests/quick-actions.browser.html')
          s=p.read_text().replace('JSON.stringify(normalize(sent)) === JSON.stringify(expected)', "JSON.stringify(normalize(sent.filter(message => message.type !== 'displayHeartbeat'))) === JSON.stringify(expected)")
          p.write_text(s)
          p=Path('display/tests/video-config.browser.html')
          s=p.read_text().replace('let rejectNextPlay = false;', "let rejectAudiblePlay = false;\n      let activated = false;\n      Object.defineProperty(navigator, 'userActivation', {\n        configurable: true, get: () => ({ hasBeenActive: activated, isActive: activated }),\n      });")
          s=s.replace("if (rejectNextPlay) {\n          rejectNextPlay = false;", "if (rejectAudiblePlay && !video.muted) {")
          s=s.replace("rejectNextPlay = true;\n        emit", "emit({ type: 'config', config: { ...defaultConfig(), videoAudioMode: 'tv', videoLoop: false } });\n        const silentBeforeActivation = video.muted && playCalls === 1;\n        activated = true;\n        rejectAudiblePlay = true;\n        emit")
          s=s.replace('&& playCalls === 3;', '&& playCalls === 4;').replace('const passed = initialMutedPlayback', 'const passed = initialMutedPlayback\n          && silentBeforeActivation').replace('          initialMutedPlayback,', '          initialMutedPlayback,\n          silentBeforeActivation,')
          p.write_text(s)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:shared
      - run: npm run typecheck
      - name: Regression tests (fail on any failed test)
        run: npm test 2>&1 | tee /tmp/media-usage-tests.log
      - run: npm run build
      - name: Browser test dependencies
        run: |
          python3 -m pip install playwright
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
      - name: Real server desktop, mobile and playback smoke tests
        run: python3 .github/qa-media-activity.py
      - name: Commit validated fixes and remove temporary transport
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/usage-patch.1 .github/usage-patch.2 .github/workflows/media-usage-validation.yml
          git add display/tests/quick-actions.browser.html display/tests/video-config.browser.html
          git commit -m 'test: validate real media controls and align browser fixtures'
          git push origin HEAD:feat/media-usage-controls-20261113
          git rev-parse HEAD > /tmp/media-usage-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frame-browser-qa
          path: |
            qa-evidence
            /tmp/media-usage-tests.log
            /tmp/media-usage-commit.txt
          retention-days: 2
