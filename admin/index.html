<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d12" />
    <link rel="manifest" href="/admin/manifest.webmanifest" />
    <title>4KFrame · Admin</title>
    <style>
      :root { --bg:#0b0d12; --panel:#161a22; --line:#252b36; --fg:#e8ecf3; --muted:#8b93a4; --accent:#4c8dff; }
      * { box-sizing: border-box; }
      body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--fg); }
      header { display:flex; align-items:center; gap:1rem; padding:1rem 1.25rem; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); }
      header h1 { font-size:1.1rem; margin:0; font-weight:600; }
      .modes { display:flex; gap:.5rem; margin-left:auto; }
      button { font:inherit; color:var(--fg); background:var(--panel); border:1px solid var(--line); border-radius:.6rem; padding:.5rem .9rem; cursor:pointer; }
      button.active { border-color:var(--accent); color:var(--accent); }
      button:hover { border-color:var(--accent); }
      main { padding:1.25rem; max-width:1100px; margin:0 auto; }
      .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:.75rem; }
      .tile { position:relative; aspect-ratio:1; border-radius:.6rem; overflow:hidden; border:1px solid var(--line); cursor:pointer; background:#000; }
      .tile.selected { border-color:var(--accent); box-shadow:0 0 0 3px rgba(76,141,255,.35); }
      .tile:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
      .tile img { width:100%; height:100%; object-fit:cover; display:block; }
      .tile .ph { width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-size:2rem; background:#11151c; }
      .tile .badge { position:absolute; top:.4rem; left:.4rem; background:rgba(0,0,0,.65); border-radius:.4rem; padding:.1rem .4rem; font-size:.7rem; }
      .tile .badge-proc { top:auto; bottom:.4rem; left:.4rem; background:rgba(76,141,255,.85); }
      .tile .badge-face { top:2rem; background:rgba(44,182,125,.85); }
      .tile .badge.dur { top:auto; bottom:.4rem; right:.4rem; left:auto; font-variant-numeric:tabular-nums; }
      .tile .incl { position:absolute; top:.35rem; right:.35rem; width:1.5rem; height:1.5rem; padding:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.6); border:1px solid var(--line); border-radius:.4rem; color:#fff; cursor:pointer; font-size:.8rem; }
      .tile .select-control { position:absolute; left:.35rem; bottom:.35rem; width:1.75rem; height:1.75rem; padding:0; border:2px solid #fff; background:rgba(0,0,0,.65); font-weight:800; }
      .tile.selected .select-control { background:var(--accent); border-color:var(--accent); }
      #bulk-toolbar { display:flex; align-items:center; flex-wrap:wrap; gap:.5rem; margin:.75rem 0; padding:.7rem; border:1px solid var(--line); border-radius:.8rem; background:var(--panel); }
      #selection-count { min-width:6.5rem; font-weight:700; }
      #bulk-toolbar button:disabled { opacity:.45; cursor:not-allowed; }
      #bulk-delete { color:#ff8b8b; }
      .tile.excluded img, .tile.excluded .ph { opacity:.3; filter:grayscale(1); }
      #control-sheet-header { display:none; }
      #controls-toggle { display:none; }
      #controls-backdrop { display:none; }
      #playback { margin-bottom:1rem; }
      #playback button { font-size:1.15rem; line-height:1; padding:.35rem .7rem; }
      .tile.delete:hover { outline:3px solid #ff5a5a; }
      .row { display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; }
      .panel { background:var(--panel); border:1px solid var(--line); border-radius:.8rem; padding:0; margin-bottom:1rem; overflow:hidden; }
      .panel-heading { margin:0; font-size:.95rem; }
      .panel-toggle { width:100%; display:flex; align-items:center; justify-content:space-between; gap:1rem; border:0; border-radius:0; background:transparent; padding:1rem 1.1rem; text-align:left; font-weight:600; }
      .panel-toggle:hover { background:rgba(255,255,255,.03); }
      .panel-toggle:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; }
      .panel-chevron { transition:transform .2s ease; }
      .panel[data-collapsed="true"] .panel-chevron { transform:rotate(-90deg); }
      .panel-body { display:grid; grid-template-rows:1fr; opacity:1; transition:grid-template-rows .24s ease, opacity .18s ease; }
      .panel-body-inner { min-height:0; overflow:hidden; padding:0 1.1rem 1rem; }
      .panel[data-collapsed="true"] .panel-body { grid-template-rows:0fr; opacity:0; }
      .panel[data-collapsed="true"] .panel-body-inner { padding-bottom:0; }
      .panel-subheading { margin:1rem 0 .8rem; font-size:.95rem; }
      @media (prefers-reduced-motion: reduce) {
        .panel-body, .panel-chevron { transition:none; }
      }
      label.field { display:flex; flex-direction:column; gap:.3rem; font-size:.8rem; color:var(--muted); }
      .muted { color:var(--muted); font-size:.85rem; }
      .seg button.active { background:var(--accent); color:#fff; border-color:var(--accent); }
      .scaling-presets button { flex:1 1 8.5rem; }
      .settings-fallback { margin-top:.65rem; }
      .settings-fallback summary { color:var(--muted); cursor:pointer; font-size:.85rem; margin-bottom:.55rem; }
      .crop-preview { display:grid; gap:.5rem; margin-bottom:.9rem; }
      .crop-preview-frame { position:relative; width:100%; aspect-ratio:var(--crop-aspect); max-height:20rem; overflow:hidden; border:1px solid var(--line); border-radius:.75rem; background:#05070b; touch-action:none; cursor:grab; }
      .crop-preview-frame:active { cursor:grabbing; }
      .crop-preview-frame:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
      .crop-preview-media { position:absolute; top:50%; left:50%; max-width:none; user-select:none; pointer-events:none; will-change:transform,width,height; }
      .crop-preview-bg { position:absolute; inset:-8%; width:116%; height:116%; object-fit:cover; filter:blur(18px) saturate(.9); opacity:.55; }
      .crop-preview-mask { position:absolute; inset:0; box-shadow:inset 0 0 0 1px rgba(255,255,255,.18), inset 0 0 4rem rgba(0,0,0,.22); pointer-events:none; }
      .crop-preview-empty { border:1px dashed var(--line); border-radius:.75rem; padding:1rem; text-align:center; }
      #drop { border:2px dashed var(--line); border-radius:.8rem; padding:1.5rem; text-align:center; color:var(--muted); margin-bottom:1rem; position:relative; }
      #drop.over { border-color:var(--accent); color:var(--fg); }
      #drop.busy { border-color:var(--accent); opacity:.7; pointer-events:none; }
      #drop.busy::after { content:attr(data-status); position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(11,13,18,.85); border-radius:.8rem; color:var(--fg); }
      .people-controls select { font:inherit; color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:.6rem; padding:.45rem .7rem; }
      .hidden { display:none !important; }
      a { color:var(--accent); }
      #login { position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; z-index:50; }
      #login form { background:var(--panel); border:1px solid var(--line); border-radius:.8rem; padding:1.5rem; display:flex; flex-direction:column; gap:.8rem; width:min(90vw,320px); }
      #login h2 { margin:0; font-size:1.1rem; }
      #login input { font:inherit; color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:.6rem; padding:.6rem .8rem; }
      #login #login-err { color:#ff6b6b; min-height:1em; }
      @media (max-width: 700px) {
        body.controls-open { overflow:hidden; }
        header { gap:.5rem; padding:.75rem; z-index:20; }
        header h1 { font-size:1rem; }
        .modes { gap:.35rem; }
        .modes button { padding:.5rem .65rem; }
        button { min-height:44px; }
        main { padding:.75rem .75rem 5.25rem; }
        #drop { margin-bottom:.65rem; padding:1rem; }
        #hint { margin:.5rem 0 .75rem; }
        #controls-toggle {
          display:block; position:fixed; right:1rem; bottom:1rem; z-index:35;
          min-width:7.25rem; box-shadow:0 .75rem 2rem rgba(0,0,0,.45);
          background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700;
        }
        #controls-backdrop {
          display:block; position:fixed; inset:0; z-index:30; background:rgba(0,0,0,.55);
          opacity:0; pointer-events:none; transition:opacity .2s ease;
        }
        body.controls-open #controls-backdrop { opacity:1; pointer-events:auto; }
        #control-sheet {
          position:fixed; left:0; right:0; bottom:0; z-index:40; max-height:min(82vh, 42rem);
          display:flex; flex-direction:column; padding:.75rem; padding-bottom:calc(.75rem + env(safe-area-inset-bottom));
          background:var(--bg); border-top:1px solid var(--line); border-radius:1rem 1rem 0 0;
          box-shadow:0 -1rem 3rem rgba(0,0,0,.5); overflow:hidden;
          transform:translateY(calc(100% + 1rem)); transition:transform .24s ease;
        }
        #control-sheet.open { transform:translateY(0); }
        #control-sheet-header { display:flex; align-items:center; justify-content:space-between; gap:.75rem; padding:.1rem .15rem .65rem; }
        #control-sheet-header h2 { margin:0; font-size:1rem; }
        #controls-close { min-width:44px; padding:.45rem .75rem; }
        #playback {
          order:1; position:sticky; top:0; z-index:1; margin:0 0 .75rem; padding:.65rem;
          background:var(--panel); border:1px solid var(--line); border-radius:.8rem;
        }
        #playback button { min-width:44px; min-height:44px; padding:.45rem .7rem; }
        #playback .muted { flex-basis:100%; margin-left:0 !important; }
        #settings { order:2; min-height:0; overflow:auto; -webkit-overflow-scrolling:touch; padding-bottom:.25rem; }
        #settings .panel:last-child { margin-bottom:0; }
        .grid { grid-template-columns:repeat(auto-fill,minmax(112px,1fr)); gap:.5rem; }
        #bulk-toolbar { position:sticky; top:4.25rem; z-index:15; align-items:stretch; }
        #bulk-toolbar button { flex:1 1 9rem; }
        #selection-count { flex-basis:100%; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>4KFrame <span class="muted">Enhanced</span></h1>
      <div class="modes seg">
        <button data-mode="cast" class="active">Cast</button>
        <button data-mode="view">View</button>
        <button data-mode="delete">Delete</button>
      </div>
      <button id="cast-device" class="hidden" title="Cast the frame to a TV" style="margin-left:.5rem">▶ Cast device</button>
      <button id="logout" class="hidden" title="Lock the admin" style="margin-left:.5rem">🔒</button>
    </header>
    <div id="login" class="hidden">
      <form id="login-form">
        <h2>4KFrame · Admin</h2>
        <input id="login-pw" type="password" placeholder="Password" autocomplete="current-password" />
        <button type="submit">Unlock</button>
        <div class="muted" id="login-err"></div>
      </form>
    </div>
    <script async src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
    <main>
      <div id="drop">Drag &amp; drop photos or videos here, or
        <label style="color:var(--accent);cursor:pointer">browse<input id="file" type="file" accept="image/*,video/*" multiple hidden /></label>
      </div>
      <button id="controls-toggle" type="button" aria-controls="control-sheet" aria-expanded="false">Controls</button>
      <div id="controls-backdrop" aria-hidden="true"></div>
      <section id="control-sheet" aria-label="Frame controls">
        <div id="control-sheet-header">
          <h2>Controls</h2>
          <button id="controls-close" type="button" aria-label="Close controls">✕</button>
        </div>
        <div id="settings"></div>
        <div id="playback" class="row">
          <button id="pb-prev" title="Previous">⏮</button>
          <button id="pb-play" title="Play / Pause">⏸</button>
          <button id="pb-next" title="Next">⏭</button>
          <button id="pb-loop" title="Loop the current item">🔁</button>
          <span class="muted" style="margin-left:.25rem">Skip / pause / loop the frame</span>
        </div>
      </section>
      <section class="panel" id="people-panel">
        <h2>Smart Face Match</h2>
        <div class="row people-controls">
          <label class="field">People filter
            <select id="people-filter">
              <option value="all">All media</option>
              <option value="has-faces">Has faces</option>
              <option value="similar-faces">Similar faces</option>
              <option value="labeled">Assigned labels</option>
            </select>
          </label>
          <label class="field">Label
            <select id="label-filter" disabled><option value="">Any label</option></select>
          </label>
          <label class="field">Sort media
            <select id="media-sort">
              <option value="date-desc">Date uploaded — newest first</option>
              <option value="date-asc">Date uploaded — oldest first</option>
              <option value="filename-asc">Filename — A to Z</option>
              <option value="filename-desc">Filename — Z to A</option>
            </select>
          </label>
          <span class="muted" id="people-summary">Face matching is opt-in on the server.</span>
        </div>
      </section>
      <p class="muted" id="hint">Cast mode: click a photo to show it on the frame.</p>
      <div id="bulk-toolbar" role="toolbar" aria-label="Selected media actions">
        <span id="selection-count" aria-live="polite">0 selected</span>
        <button id="select-visible" type="button">Select all visible</button>
        <button id="clear-selection" type="button">Clear</button>
        <button id="bulk-delete" type="button" data-requires-selection disabled>Delete selected</button>
        <button id="bulk-favorite" type="button" data-requires-selection disabled>Add to Favorites</button>
        <button id="bulk-unfavorite" type="button" data-requires-selection disabled>Remove from Favorites</button>
        <button id="bulk-play" type="button" data-requires-selection disabled>Play selected in sequence</button>
        <span class="muted">Favorites participate in automatic playback.</span>
      </div>
      <div id="grid" class="grid"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
