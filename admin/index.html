<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d12" />
    <link rel="manifest" href="/admin/manifest.webmanifest" />
    <title>4KFrame · Admin</title>
    <style>
      :root { --bg:#0b0d12; --panel:#161a22; --line:#252b36; --fg:#e8ecf3; --muted:#8b93a4; --accent:#4c8dff; }
      * { box-sizing: border-box; }
      body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--fg); }
      header { display:flex; align-items:center; gap:1rem; padding:1rem 1.25rem; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); }
      header h1 { font-size:1.1rem; margin:0; font-weight:600; }
      .modes { display:flex; gap:.5rem; margin-left:auto; }
      button { font:inherit; color:var(--fg); background:var(--panel); border:1px solid var(--line); border-radius:.6rem; padding:.5rem .9rem; cursor:pointer; }
      button.active { border-color:var(--accent); color:var(--accent); }
      button:hover { border-color:var(--accent); }
      main { padding:1.25rem; max-width:1100px; margin:0 auto; }
      .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:.75rem; }
      .tile { position:relative; aspect-ratio:1; border-radius:.6rem; overflow:hidden; border:1px solid var(--line); cursor:pointer; background:#000; }
      .tile img { width:100%; height:100%; object-fit:cover; display:block; }
      .tile .ph { width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-size:2rem; background:#11151c; }
      .tile .badge { position:absolute; top:.4rem; left:.4rem; background:rgba(0,0,0,.65); border-radius:.4rem; padding:.1rem .4rem; font-size:.7rem; }
      .tile .badge-proc { top:auto; bottom:.4rem; left:.4rem; background:rgba(76,141,255,.85); }
      .tile .badge.dur { top:auto; bottom:.4rem; right:.4rem; left:auto; font-variant-numeric:tabular-nums; }
      .tile .incl { position:absolute; top:.35rem; right:.35rem; width:1.5rem; height:1.5rem; padding:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.6); border:1px solid var(--line); border-radius:.4rem; color:#fff; cursor:pointer; font-size:.8rem; }
      .tile.excluded img, .tile.excluded .ph { opacity:.3; filter:grayscale(1); }
      #playback button { font-size:1.15rem; line-height:1; padding:.35rem .7rem; }
      .tile.delete:hover { outline:3px solid #ff5a5a; }
      .row { display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; }
      .panel { background:var(--panel); border:1px solid var(--line); border-radius:.8rem; padding:1rem 1.1rem; margin-bottom:1rem; }
      .panel h2 { margin:.1rem 0 .8rem; font-size:.95rem; }
      label.field { display:flex; flex-direction:column; gap:.3rem; font-size:.8rem; color:var(--muted); }
      .muted { color:var(--muted); font-size:.85rem; }
      .seg button.active { background:var(--accent); color:#fff; border-color:var(--accent); }
      #drop { border:2px dashed var(--line); border-radius:.8rem; padding:1.5rem; text-align:center; color:var(--muted); margin-bottom:1rem; position:relative; }
      #drop.over { border-color:var(--accent); color:var(--fg); }
      #drop.busy { border-color:var(--accent); opacity:.7; pointer-events:none; }
      #drop.busy::after { content:attr(data-status); position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(11,13,18,.85); border-radius:.8rem; color:var(--fg); }
      .hidden { display:none !important; }
      a { color:var(--accent); }
      #login { position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; z-index:50; }
      #login form { background:var(--panel); border:1px solid var(--line); border-radius:.8rem; padding:1.5rem; display:flex; flex-direction:column; gap:.8rem; width:min(90vw,320px); }
      #login h2 { margin:0; font-size:1.1rem; }
      #login input { font:inherit; color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:.6rem; padding:.6rem .8rem; }
      #login #login-err { color:#ff6b6b; min-height:1em; }
    </style>
  </head>
  <body>
    <header>
      <h1>4KFrame <span class="muted">Enhanced</span></h1>
      <div class="modes seg">
        <button data-mode="cast" class="active">Cast</button>
        <button data-mode="view">View</button>
        <button data-mode="delete">Delete</button>
      </div>
      <button id="cast-device" class="hidden" title="Cast the frame to a TV" style="margin-left:.5rem">▶ Cast device</button>
      <button id="logout" class="hidden" title="Lock the admin" style="margin-left:.5rem">🔒</button>
    </header>
    <div id="login" class="hidden">
      <form id="login-form">
        <h2>4KFrame · Admin</h2>
        <input id="login-pw" type="password" placeholder="Password" autocomplete="current-password" />
        <button type="submit">Unlock</button>
        <div class="muted" id="login-err"></div>
      </form>
    </div>
    <script async src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
    <main>
      <div id="drop">Drag &amp; drop photos or videos here, or
        <label style="color:var(--accent);cursor:pointer">browse<input id="file" type="file" accept="image/*,video/*" multiple hidden /></label>
      </div>
      <div id="settings"></div>
      <div id="playback" class="row">
        <button id="pb-prev" title="Previous">⏮</button>
        <button id="pb-play" title="Play / Pause">⏸</button>
        <button id="pb-next" title="Next">⏭</button>
        <button id="pb-loop" title="Loop the current item">🔁</button>
        <span class="muted" style="margin-left:.25rem">Skip / pause / loop the frame</span>
      </div>
      <p class="muted" id="hint">Cast mode: click a photo to show it on the frame.</p>
      <div id="grid" class="grid"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
